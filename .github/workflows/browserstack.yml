name: BrowserStack App Automate

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to test"
        required: true
        default: ios
        type: choice
        options: [ios, android]
      suite:
        description: "Test suite"
        required: true
        default: smoke
        type: choice
        options: [smoke, regression]

jobs:
  browserstack:
    name: "${{ inputs.suite }} / ${{ inputs.platform }} — BrowserStack"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      # ── Upload app to BrowserStack ─────────────────────────────────────────
      # iOS .ipa or Android .apk must be present in apps/ (gitignored).
      # In CI, download the build artifact first, or upload a pre-built binary
      # stored as a GitHub Actions artifact / release asset.
      - name: Upload iOS app to BrowserStack
        if: inputs.platform == 'ios'
        id: upload_ios
        run: |
          response=$(curl -s -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
            -F "file=@apps/spotify-clone.ipa" \
            -F "custom_id=spotify-clone-ios")
          echo "response=$response"
          app_url=$(echo "$response" | python3 -c "import sys,json; print(json.load(sys.stdin)['app_url'])")
          echo "BROWSERSTACK_APP_ID=$app_url" >> "$GITHUB_ENV"

      - name: Upload Android app to BrowserStack
        if: inputs.platform == 'android'
        id: upload_android
        run: |
          response=$(curl -s -u "$BROWSERSTACK_USERNAME:$BROWSERSTACK_ACCESS_KEY" \
            -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
            -F "file=@apps/spotify-clone.apk" \
            -F "custom_id=spotify-clone-android")
          echo "response=$response"
          app_url=$(echo "$response" | python3 -c "import sys,json; print(json.load(sys.stdin)['app_url'])")
          echo "BROWSERSTACK_APP_ID=$app_url" >> "$GITHUB_ENV"

      # ── Run tests ──────────────────────────────────────────────────────────
      - name: Run ${{ inputs.suite }} tests on BrowserStack
        env:
          APPIUM_SERVER_URL: "https://${{ secrets.BROWSERSTACK_USERNAME }}:${{ secrets.BROWSERSTACK_ACCESS_KEY }}@hub.browserstack.com/wd/hub"
          BROWSERSTACK_APP_ID: ${{ env.BROWSERSTACK_APP_ID }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          uv run pytest -m "${{ inputs.suite }}" \
            --platform=${{ inputs.platform }} \
            --alluredir=allure-results \
            -v

      # ── Artifacts ──────────────────────────────────────────────────────────
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ inputs.platform }}-${{ inputs.suite }}
          path: allure-results/
          if-no-files-found: ignore

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ inputs.platform }}-${{ inputs.suite }}
          path: test-results/screenshots/
          if-no-files-found: ignore
